<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>【2026】お祭り役割分担表</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans JP", sans-serif; }
        body { background-color: #f7f9fc; color: #333333; padding: 16px; padding-bottom: 40px; }
        .container { max-width: 500px; margin: 0 auto; }
        header { text-align: center; background: linear-gradient(135deg, #d32f2f, #f44336); color: white; padding: 20px 16px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 12px rgba(211, 47, 47, 0.2); }
        header h1 { font-size: 20px; font-weight: 700; margin-bottom: 6px; letter-spacing: 0.5px; }
        header p { font-size: 13px; opacity: 0.9; }
        .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #666; margin-bottom: 6px; }
        
        /* スマホで確実にタップできるように極限までシンプルに修正 */
        select { 
            width: 100%; 
            padding: 14px; 
            font-size: 16px; 
            border: 2px solid #e2e8f0; 
            border-radius: 8px; 
            background-color: #ffffff; 
            color: #333333; 
            outline: none;
            display: block;
        }
        select:focus { border-color: #d32f2f; }
        
        .result-title { font-size: 16px; font-weight: 700; color: #1a202c; margin-bottom: 12px; border-left: 4px solid #d32f2f; padding-left: 8px; }
        .timeline { position: relative; margin-top: 10px; }
        .timeline-item { position: relative; padding-left: 24px; margin-bottom: 20px; }
        .timeline-item:last-child { margin-bottom: 0; }
        .timeline-item::before { content: ''; position: absolute; left: 4px; top: 4px; width: 8px; height: 8px; border-radius: 50%; background-color: #d32f2f; z-index: 2; }
        .timeline-item::after { content: ''; position: absolute; left: 7px; top: 12px; width: 2px; height: calc(100% + 12px); background-color: #e2e8f0; z-index: 1; }
        .timeline-item:last-child::after { display: none; }
        .time-badge { font-size: 13px; font-weight: 700; color: #d32f2f; margin-bottom: 4px; }
        .role-box { background-color: #fff5f5; border: 1px solid #fed7d7; padding: 10px 12px; border-radius: 8px; margin-top: 4px; }
        .role-name { font-size: 15px; font-weight: 700; color: #9b2c2c; }
        .same-role-members { font-size: 12px; color: #4a5568; margin-top: 6px; background: rgba(255,255,255,0.7); padding: 4px 6px; border-radius: 4px; }
        .no-assignment { background-color: #f7fafc; border: 1px solid #edf2f7; color: #718096; }
        .all-schedule-box { background-color: #f0fff4; border: 1px solid #c6f6d5; padding: 8px 12px; border-radius: 8px; font-size: 13px; color: #22543d; margin-top: 6px; line-height: 1.4; }
        .notes-card h3 { font-size: 14px; color: #4a5568; margin-bottom: 10px; }
        .notes-list { list-style: none; font-size: 13px; color: #4a5568; line-height: 1.5; }
        .notes-list li { position: relative; padding-left: 14px; margin-bottom: 6px; }
        .notes-list li::before { content: "•"; color: #d32f2f; position: absolute; left: 0; font-weight: bold; }
        .footer-text { text-align: center; font-size: 11px; color: #a0aec0; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>【2026】お祭り役割分担表</h1>
        <p>日付と名前を選ぶと、当日のスケジュールが表示されます</p>
    </header>

    <div class="card">
        <div class="form-group">
            <label for="dateSelect">日付を選択</label>
            <select id="dateSelect" onchange="updateView()">
                <option value="">-- タップして日付を選択 --</option>
            </select>
        </div>
        <div class="form-group" style="margin-top: 12px;">
            <label for="nameSelect">お名前を選択</label>
            <select id="nameSelect" onchange="updateView()">
                <option value="">-- タップして名前を選択 --</option>
            </select>
        </div>
    </div>

    <div class="card" id="resultCard" style="display: none;">
        <div class="result-title">
            <span id="displayTarget">当日の役割</span>
        </div>
        <div class="timeline" id="timelineContainer"></div>
    </div>

    <div class="card notes-card" id="notesCard" style="display: none;">
        <h3>本日の全体流れ・備考</h3>
        <ul class="notes-list" id="notesContainer"></ul>
    </div>

    <div class="footer-text">
        © 2026 お祭り実行委員会 | LINE共有・スマホ最適化版
    </div>
</div>
