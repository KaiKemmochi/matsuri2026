                "12:30 リヤカー・菓子準備 -> 13:00 出発 -> 13:30 六行会休憩 -> 14:00 福栄会休憩 -> 14:30 松の広場到着 -> 15:00 接待準備 -> 15:30 冷凍庫",
                "16:30 セレモニー、おにぎり@伊勢屋(100)",
                "18:00 冷凍庫 -> 18:30 ニチゲン休憩、高張用意 -> 20:00 松の広場到着、御霊抜き(予定)"
            ]
        },
        "8/10(月)": {
            "schedule": {
                "9:00": { "小宮山": "清掃片付け", "青海": "清掃片付け", "大木正": "(清掃)神酒所片付け", "大木佳": "(清掃)神酒所片付け", "藤井": "(清掃)神酒所片付け", "加藤ひ": "(清掃)片付け", "全部署": "9:00 各所清掃・片付け作業" }
            },
            "notes": [
                "9:00 清掃・片付け（神酒所など）"
            ]
        }
    };

    const memberList = [
        "相原", "小宮山", "吉野秀", "青海", "剣持", "大木正", "大木佳", "藤井", 
        "池田", "長谷川", "蟹江", "友滝", "寺本", "岩崎", "舘野", "津田", 
        "稲垣", "西島", "大石", "倉田け", "倉田ゆ", "加藤父", "加藤ひ", 
        "加藤宏太郎", "加藤宏樹", "吉野敏", "鈴木", "一木", "清野"
    ];

    window.addEventListener('DOMContentLoaded', () => {
        const dateSelect = document.getElementById('dateSelect');
        const nameSelect = document.getElementById('nameSelect');
        
        Object.keys(rosterData).forEach(day => {
            const opt = document.createElement('option');
            opt.value = day; opt.textContent = day;
            dateSelect.appendChild(opt);
        });
        
        memberList.forEach(name => {
            const opt = document.createElement('option');
            opt.value = name; opt.textContent = name;
            nameSelect.appendChild(opt);
        });
    });

    function updateView() {
        const selectedDate = document.getElementById('dateSelect').value;
        const selectedName = document.getElementById('nameSelect').value;
        
        if (!selectedDate || !selectedName) {
            document.getElementById('resultCard').style.display = 'none';
            document.getElementById('notesCard').style.display = 'none';
            return;
        }

        document.getElementById('displayTarget').textContent = `${selectedDate} : ${selectedName} さんの役割`;
        const dayInfo = rosterData[selectedDate];
        const timelineContainer = document.getElementById('timelineContainer');
        timelineContainer.innerHTML = '';
        let hasAnyAssignment = false;
        
        Object.keys(dayInfo.schedule).forEach(time => {
            const slots = dayInfo.schedule[time];
            let myRole = slots[selectedName] || "";
            let allSchedule = slots["全部署"] || "";
            if (!myRole && !allSchedule) return;

            hasAnyAssignment = true;
            const itemDiv = document.createElement('div');
            itemDiv.className = 'timeline-item';
            const timeBadge = document.createElement('div');
            timeBadge.className = 'time-badge'; timeBadge.textContent = time;
            itemDiv.appendChild(timeBadge);

            if (myRole) {
                const roleBox = document.createElement('div');
                roleBox.className = 'role-box';
                const roleName = document.createElement('div');
                roleName.className = 'role-name'; roleName.textContent = myRole;
                roleBox.appendChild(roleName);

                const sameRoleMembers = [];
                Object.keys(slots).forEach(m => {
                    if (m !== "全部署" && m !== selectedName && slots[m] === myRole) {
                        sameRoleMembers.push(m);
                    }
                });
                if (sameRoleMembers.length > 0) {
                    const sameRoleDiv = document.createElement('div');
                    sameRoleDiv.className = 'same-role-members';
                    sameRoleDiv.textContent = `同じ役割の人: ${sameRoleMembers.join(', ')}`;
                    roleBox.appendChild(sameRoleDiv);
                }
                itemDiv.appendChild(roleBox);
            } else {
                const noAssignBox = document.createElement('div');
                noAssignBox.className = 'role-box no-assignment';
                noAssignBox.textContent = '個別タスクなし / 待機・自由';
                itemDiv.appendChild(noAssignBox);
            }

            if (allSchedule) {
                const allBox = document.createElement('div');
                allBox.className = 'all-schedule-box';
                allBox.textContent = `📢 全体連絡: ${allSchedule}`;
                itemDiv.appendChild(allBox);
            }
            timelineContainer.appendChild(itemDiv);
        });

        if (!hasAnyAssignment) {
            timelineContainer.innerHTML = '<div style="color:#666; text-align:center; padding: 20px 0;">この日の予定は登録されていません。</div>';
        }
        document.getElementById('resultCard').style.display = 'block';

        const notesContainer = document.getElementById('notesContainer');
        notesContainer.innerHTML = '';
        if (dayInfo.notes && dayInfo.notes.length > 0) {
            dayInfo.notes.forEach(note => {
                const li = document.createElement('li'); li.textContent = note;
                notesContainer.appendChild(li);
            });
            document.getElementById('notesCard').style.display = 'block';
        } else {
            document.getElementById('notesCard').style.display = 'none';
        }
    }
</script>
</body>
</html>
